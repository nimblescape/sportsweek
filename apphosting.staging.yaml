# Overrides for staging, layered over apphosting.yaml.
#
# App Hosting picks this file for any backend whose Environment name is `staging`
# (console > App Hosting > View dashboard > Settings > Environment). `npm run dev:staging`
# sets APP_HOSTING_ENV=staging so next.config.ts merges it the same way locally.
# See https://firebase.google.com/docs/app-hosting/multiple-environments.
#
# No AUTH_MODE: this project is pinned to the fake login in src/lib/auth/auth-mode.ts, which
# is where the sign-in is decided. Naming it here would be a second answer to a settled
# question, read by nobody. Every NEXT_PUBLIC_FIREBASE_ value is restated rather than
# inherited, and apphosting-env.test.ts fails the build if one goes missing.
runConfig:
  minInstances: 0
  maxInstances: 1

env:
  # Public in the same sense as the production key -- it identifies the project, it does not
  # grant access. Restrict it to this project's own origins in the Cloud console.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyABbpPwfzqZHYmxYEkHkCkFcDTd0G0tXmc
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: sportsweek-staging.htldornbirn.org
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: htld-sportsweek-staging
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: htld-sportsweek-staging.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "124249657490"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:124249657490:web:172cf58935cb8af74c164b"
    availability:
      - BUILD
      - RUNTIME
