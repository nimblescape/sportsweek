name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Enough for checkout, and nothing more. Artifact upload authenticates with the runtime
# token rather than this one, so it needs no scope here.
permissions:
  contents: read

jobs:
  # Which gates a pull request has to pass depends on what it touches, and the condition has to
  # live on the jobs rather than on the workflow: a workflow filtered out by `paths-ignore`
  # reports nothing at all, and a required check that never reports leaves the pull request
  # pending for ever. A job skipped by a condition still reports, so the branch rule is met.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The comparison reaches back to the base commit, which a shallow clone does not hold.
          fetch-depth: 0
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Nothing to compare against on a manual dispatch, and the cheap answer is the unsafe
          # one, so it is never the default.
          if [ -z "${BASE_SHA}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "${BASE_SHA}" HEAD)
          echo "Changed files:"
          echo "${changed}"

          # `spec/` is prose the application never reads. Everything else — source,
          # configuration, the workflows themselves — counts as code. An empty diff matches
          # nothing here and so reads as code, which errs towards running the gates.
          if printf '%s\n' "${changed}" | grep -qvE '^spec/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs whatever a pull request touches, because the licence headers and the formatting cover
  # `spec/` as well — a specification arrives unstamped or unformatted as easily as anything
  # else. Only the steps that read the source are conditional.
  lint-and-unit:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run license:check
      - run: npm run format:check
      - if: needs.changes.outputs.code == 'true'
        run: npm run lint
      # Route types follow pageExtensions, which follows the sign-in mode: generated for
      # production they would omit /api/auth/fake, and the code that calls it fails to compile.
      - if: needs.changes.outputs.code == 'true'
        run: npx next typegen
        env:
          APP_HOSTING_ENV: development
      - if: needs.changes.outputs.code == 'true'
        run: npx tsc --noEmit
      - if: needs.changes.outputs.code == 'true'
        run: npm test

  # Dependabot reports a vulnerability that is already on `main`. This is the half that keeps
  # one from getting there, which is the cheaper end to catch it at.
  supply-chain:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `--omit=dev` is the tree that reaches a user, and it is the one held to zero. The full
      # tree is not: the emulator and the CLIs carry advisories whose only fix is a version
      # that breaks them, and failing every pull request over a DoS in a local tool would buy
      # nothing. Those stay visible as Dependabot alerts, where they can be judged one by one.
      - run: npm audit --omit=dev --audit-level=moderate
      # Version numbers say what a package claims to be. Attestations say the registry signed
      # that exact tarball, which is what a compromised or substituted publish fails.
      - run: npm audit signatures
      # Blocks a pull request that *introduces* a vulnerable or newly-flagged dependency,
      # including a transitive one nothing in the diff mentions by name.
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          # The gate above owns the production tree; this one would otherwise re-fail the
          # build-only advisories that were deliberately accepted there.
          fail-on-scopes: runtime

  rules:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run test:rules

  # Asserts on the artifact rather than on the decision that produces it: every unit test
  # still passes if a page extension or an import puts the fake login back into production.
  production-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:production-build

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
