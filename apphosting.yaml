# What every environment shares, and nothing else.
#
# App Hosting always reads this file and merges apphosting.<environment>.yaml on top, choosing
# that file by the backend's Environment name. There is no way to keep a base out of a
# deployment, so anything standing here is handed to an environment whether it asked or not --
# which is why nothing environment-specific does. A backend with no Environment name gets no
# Firebase project at all and the build stops, rather than quietly borrowing another
# environment's. See requireFirebaseProject in src/lib/apphosting-env.ts.
#
# See https://firebase.google.com/docs/app-hosting/multiple-environments.
runConfig:
  minInstances: 0
  maxInstances: 1

env:
  # The one Entra ID tenant every environment signs in against, so it is genuinely shared
  # rather than a default waiting to be overridden.
  - variable: NEXT_PUBLIC_ENTRA_ID_TENANT_ID
    value: 9987787c-b131-4ef8-bdad-35e3b7c323ec
    availability:
      - BUILD
      - RUNTIME
# AUTH_MODE is not here, and not in every environment file either: src/lib/auth/auth-mode.ts
# is the single place the sign-in is decided. It pins production to Entra ID and staging to the
# fake login by project, reads AUTH_MODE only for development, and answers Entra ID for any
# project nobody named -- so an environment that says nothing gets the real sign-in.
#
# No service account keys are used anywhere: on App Hosting, firebase-admin uses Application
# Default Credentials automatically via the backend's service account. Local development uses
# `gcloud auth application-default login` instead. The public values in these files are read
# straight from them by next.config.ts, so no .env file is needed.
